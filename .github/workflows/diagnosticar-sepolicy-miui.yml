name: Diagnosticar SELinux com o vendor original MIUI 12.5

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Link direto do zip da ROM base (creek, Indonesia, com payload.bin)"
        required: true
        type: string
      miui_path:
        description: "Caminho do zip recovery da MIUI 12.5 EEA no CDN da Xiaomi"
        required: true
        default: "V12.5.12.0.RCOEUXM/miui_GINKGOEEAGlobal_V12.5.12.0.RCOEUXM_f9fdc6c783_11.0.zip"
        type: string
      drive_id:
        description: "ID do zip do GSI no Google Drive"
        required: true
        default: "1zETh1vs-MbizeUNVwYNW3IJKLjW6jWhb"
        type: string

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ROM_URL: ${{ inputs.rom_url }}
      MIUI_PATH: ${{ inputs.miui_path }}
      DRIVE_ID: ${{ inputs.drive_id }}
    steps:
      - name: Liberar espaco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 erofs-utils unzip e2fsprogs secilc brotli python3-pip
          pip install --break-system-packages gdown
          go install github.com/ssut/payload-dumper-go@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Baixar a ROM base e extrair as imagens
        run: |
          mkdir -p work out
          aria2c -x 16 -s 16 -k 8M --file-allocation=none \
            --max-tries=10 --retry-wait=5 \
            --summary-interval=60 --console-log-level=warn \
            -d work -o rom.zip "$ROM_URL"
          size=$(stat -c %s work/rom.zip)
          if [ "$size" -lt 1000000000 ]; then
            echo "ERRO: o arquivo da ROM base tem so $size bytes."
            exit 1
          fi
          unzip -o work/rom.zip payload.bin -d work
          rm -f work/rom.zip
          payload-dumper-go -p system,system_ext,product -o out work/payload.bin
          find out -name '*.img' -exec mv {} out/ \; 2>/dev/null || true
          rm -f work/payload.bin
          mkdir -p tree
          for n in system system_ext product; do
            mkdir -p "tree/$n"
            sudo fsck.erofs --extract="tree/$n" --preserve "out/$n.img" \
              || sudo fsck.erofs --extract="tree/$n" "out/$n.img"
          done
          rm -f out/*.img
          df -h /

      - name: Pegar a politica do vendor do GSI (PixelOS)
        run: |
          gdown "https://drive.google.com/uc?id=$DRIVE_ID" -O work/gsi.zip
          cd work
          unzip -o gsi.zip 'images/vendor.img.gz'
          rm -f gsi.zip
          mkdir -p ../vsel vmnt
          gzip -dc images/vendor.img.gz > vendor.img
          sudo mount -o loop,ro vendor.img vmnt
          sudo cp -r vmnt/etc/selinux/. ../vsel/
          sudo grep -hE 'ro.vendor.build.fingerprint=' vmnt/build.prop vmnt/etc/build.prop 2>/dev/null | sort -u > ../fp-pixelos.txt || true
          sudo umount vmnt
          rm -f vendor.img
          cd ..
          sudo chown -R "$(id -u):$(id -g)" vsel

      - name: Escolher um espelho rapido da MIUI
        timeout-minutes: 10
        run: |
          : > espelhos.txt
          for host in cdnorg.d.miui.com hugeota.d.miui.com ultimateota.d.miui.com bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com bigota.d.miui.com; do
            r=$(curl -s -L -r 0-4194303 -o /dev/null --max-time 25 -w '%{http_code} %{speed_download}' "https://$host/$MIUI_PATH" || true)
            echo "$host $r" | tee -a espelhos.txt
          done
          host=$(awk '($2==206||$2==200) && $3>=1000000 {print $1; exit}' espelhos.txt)
          if [ -z "$host" ]; then
            echo "Nenhum espelho passou de 1 MB/s; usando o primeiro que respondeu."
            host=$(awk '($2==206||$2==200) {print $1; exit}' espelhos.txt)
          fi
          if [ -z "$host" ]; then
            echo "ERRO: nenhum espelho tem esse arquivo. Confira o caminho: $MIUI_PATH"
            exit 1
          fi
          echo "MIUI_URL_OK=https://$host/$MIUI_PATH" >> "$GITHUB_ENV"
          echo "escolhido: https://$host/$MIUI_PATH"

      - name: Baixar a MIUI 12.5 e extrair a politica do vendor original
        timeout-minutes: 30
        run: |
          cd work
          pip install --break-system-packages remotezip
          if ! timeout 900 remotezip "$MIUI_URL_OK" vendor.new.dat.br vendor.transfer.list; then
            echo "remotezip falhou; baixando o zip inteiro (limite de 25 min)"
            timeout 1500 aria2c -x 16 -s 16 -k 8M --file-allocation=none \
              --max-tries=3 --retry-wait=5 --timeout=60 --connect-timeout=30 \
              --summary-interval=60 --console-log-level=warn \
              -o miui.zip "$MIUI_URL_OK"
            size=$(stat -c %s miui.zip)
            if [ "$size" -lt 1000000000 ]; then
              echo "ERRO: o arquivo da MIUI tem so $size bytes. Inicio do conteudo:"
              head -c 600 miui.zip
              exit 1
            fi
            unzip -o miui.zip vendor.new.dat.br vendor.transfer.list
            rm -f miui.zip
          fi
          ls -l vendor.new.dat.br vendor.transfer.list
          brotli -d vendor.new.dat.br -o vendor.new.dat
          curl -sL https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py -o sdat2img.py
          python3 sdat2img.py vendor.transfer.list vendor.new.dat vendor-orig.img
          rm -f vendor.new.dat vendor.new.dat.br
          mkdir -p ../osel omnt
          sudo mount -o loop,ro vendor-orig.img omnt
          sudo cp -r omnt/etc/selinux/. ../osel/
          sudo grep -hE 'ro.vendor.build.fingerprint=' omnt/build.prop omnt/etc/build.prop 2>/dev/null | sort -u > ../fp-miui.txt || true
          sudo umount omnt
          cd ..
          sudo chown -R "$(id -u):$(id -g)" osel
          ls osel

      - name: Compilar com a politica original do vendor
        run: |
          VER=$(tr -d '\n ' < osel/plat_sepolicy_vers.txt)
          echo "$VER" > versao-original.txt
          SYS=tree/system/system/etc/selinux
          SE=tree/system_ext/etc/selinux
          PR=tree/product/etc/selinux
          : > uso-arquivos.txt
          args=(-m -M true -G -N -c 30 "$SYS/plat_sepolicy.cil")
          for f in "$SYS/mapping/$VER.cil" "$SYS/mapping/$VER.compat.cil" \
                   "$SE/system_ext_sepolicy.cil" "$SE/mapping/$VER.cil" "$SE/mapping/$VER.compat.cil" \
                   "$PR/product_sepolicy.cil" "$PR/mapping/$VER.cil" "$PR/mapping/$VER.compat.cil" \
                   osel/plat_pub_versioned.cil osel/vendor_sepolicy.cil osel/odm_sepolicy.cil; do
            if sudo test -f "$f"; then
              args+=("$f")
              echo "usando:  $f" >> uso-arquivos.txt
            else
              echo "ausente: $f" >> uso-arquivos.txt
            fi
          done
          printf '%s\n' "${args[@]}" > args-compilacao.txt
          if sudo secilc "${args[@]}" -o politica-original.bin -f /dev/null > log-original.txt 2>&1; then
            echo "COMPILOU" > resultado.txt
            ls -l politica-original.bin >> resultado.txt
          else
            echo "FALHOU" > resultado.txt
            head -25 log-original.txt >> resultado.txt
          fi
          cat uso-arquivos.txt
          cat resultado.txt

      - name: Investigar o erro de genfscon
        run: |
          SYS=tree/system/system/etc/selinux
          SE=tree/system_ext/etc/selinux
          PR=tree/product/etc/selinux
          {
            echo "arquivos em system/etc/selinux:"
            sudo ls "$SYS" | tr '\n' ' ' | fold -w 90
            echo ""
            echo ""
            echo "quantidade de genfscon por arquivo:"
            for f in "$SYS/plat_sepolicy.cil" "$SE/system_ext_sepolicy.cil" "$PR/product_sepolicy.cil" osel/vendor_sepolicy.cil osel/plat_pub_versioned.cil; do
              n=$(sudo grep -c '^(genfscon' "$f" || true)
              echo "$n  $f"
            done
            echo ""
            echo "genfscon repetidos entre arquivos (mesmo fs e caminho):"
          } > genfs-info.txt
          sudo awk '/^\(genfscon/ {p=$3; gsub(/"/,"",p); print FILENAME "|" $2 "|" p}' \
            "$SYS/plat_sepolicy.cil" "$SE/system_ext_sepolicy.cil" "$PR/product_sepolicy.cil" osel/vendor_sepolicy.cil > genfscon-todos.txt || true
          awk -F'|' '{k=$2"|"$3; c[k]++; a[k]=a[k]" "$1} END{for(k in c) if (c[k]>1) print c[k]" "k" <-"a[k]}' genfscon-todos.txt | sort -rn | head -25 | cut -c1-230 >> genfs-info.txt || true
          echo "total de pares repetidos: $(awk -F'|' '{k=$2"|"$3; c[k]++} END{n=0; for(k in c) if (c[k]>1) n++; print n}' genfscon-todos.txt)" >> genfs-info.txt
          args=(-m -M true -G -N -c 30 "$SYS/plat_sepolicy.cil")
          if sudo secilc "${args[@]}" -o politica-plat.bin -f /dev/null > log-plat.txt 2>&1; then
            echo "so a plataforma do creek: COMPILOU" >> genfs-info.txt
          else
            { echo "so a plataforma do creek: FALHOU"; head -8 log-plat.txt; } >> genfs-info.txt
          fi
          mapfile -t args2 < args-compilacao.txt
          sudo secilc -vv "${args2[@]}" -o politica-v.bin -f /dev/null > log-verboso.txt 2>&1 || true
          tail -30 log-verboso.txt | cut -c1-200 > log-verboso-fim.txt
          cat genfs-info.txt
          cat log-verboso-fim.txt

      - name: Relatorio
        run: |
          {
            echo "## Politica do vendor original (MIUI 12.5): versao $(cat versao-original.txt)"
            echo ""
            echo "### Espelhos testados (host, codigo, bytes/s)"
            echo '```'
            cat espelhos.txt
            echo '```'
            echo ""
            echo "### Fingerprints do vendor"
            echo '```'
            echo "MIUI:     $(cat fp-miui.txt)"
            echo "PixelOS:  $(cat fp-pixelos.txt)"
            echo '```'
            echo ""
            echo "### Tamanho dos arquivos .cil do vendor (linhas)"
            echo '```'
            echo "vendor_sepolicy.cil     original: $(wc -l < osel/vendor_sepolicy.cil)   PixelOS: $(wc -l < vsel/vendor_sepolicy.cil)"
            echo "plat_pub_versioned.cil  original: $(wc -l < osel/plat_pub_versioned.cil)   PixelOS: $(wc -l < vsel/plat_pub_versioned.cil)"
            echo '```'
            echo ""
            echo "### Arquivos usados na compilacao"
            echo '```'
            cat uso-arquivos.txt
            echo '```'
            echo ""
            echo "### Resultado (secilc)"
            echo '```'
            cat resultado.txt
            echo '```'
            echo ""
            echo "### Investigacao do genfscon"
            echo '```'
            cat genfs-info.txt
            echo '```'
            echo ""
            echo "### Log verboso do secilc (final)"
            echo '```'
            cat log-verboso-fim.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
